# Game Studios Project Configuration — The Last Escapor (The Last Survivor)
# Source de vérité alignée sur le GDD officiel — SAÉ 5.D.01

schema_version: 1

project:
  name: "The Last Escapor"
  subtitle: "The Last Survivor"
  package_name: "com.sae501.vr"
  version: "1.0.0"
  genre: "VR Survival Horror / Wave Defense"
  stage: "Production"
  target_deadline: "2026-11-13"
  framework: "Game Studios Antigravity"
  team:
    - name: "Rahim Tamhaev"
    - name: "Al Amine Bah"
    - name: "Alban Chabalier"
    - name: "Hugo Delpuech"
  target_audience:
    bartle_profile:
      killer: 5
      achiever: 3
      socializer: 2
      explorer: 1
  usp: "Un jeu à la Call of Duty Zombies avec une immersion physique en réalité virtuelle."
  ksp:
    - "Shooter VR ultra-immersif confrontant le joueur à des hordes oppressantes de zombies."
    - "Système de vagues à difficulté croissante avec gestion de tension et d'espace à 360°."
    - "Interactions physiques réalistes (clouer, recharger, manipuler portes et disjoncteurs)."

engine:
  name: "Unity"
  version: "6000.6.0f1"
  language: "C#"
  render_pipeline: "URP"
  code_root: "Assets/Scripts"
  scene_build_script: "Assets/Editor/SetupVRScene.cs"
  main_scene: "Assets/Scenes/MainScene.unity"

platform:
  targets:
    - "Meta Quest 3 (Standalone Android)"
    - "PC (Desktop Clavier + Souris via DesktopPlayer)"
  primary: "Meta Quest 3"
  vr:
    enabled: true
    xr_toolkit: "XR Interaction Toolkit 3.6"
    openxr_version: "1.18"
    meta_xr_sdk: "205"
    foveated_rendering: true
    comfort:
      locomotion: "Snap Turn (rotation par crans) / Smooth Turn réglable"
      scale: "1 unit = 1 meter"
      camera_control: "Liberté totale de la tête (360°), pas de translation imposée"

performance:
  target_framerate: 72
  frame_budget_ms: 13.88
  msaa: 4
  dithering: true
  draw_call_limit: 150
  memory_ceiling_mb: 2048

specialists:
  engine: "unity-specialist"
  ui: "unity-ui-specialist"
  shader: "unity-shader-specialist"

modes:
  rigor: "standard"
  automation: "collaborative"

gameplay:
  win_condition: "Trouver la clé, traverser les salles débloquées, allumer le générateur et presser le bouton d'évacuation."
  lose_condition: "Mourir (0 PV)."
  3c:
    camera: "Caméra VR 360° à l'échelle 1:1"
    controls:
      vr:
        left_hand:
          trigger: "Tirer / Utiliser"
          joystick_press: "Bouger / S'accroupir"
          grip: "Attraper / Lâcher (par clic)"
          menu_button: "Pause"
        right_hand:
          trigger: "Tirer / Utiliser"
          joystick: "Tourner (Snap Turn ou Smooth Turn)"
          grip: "Attraper / Lâcher (par clic)"
      body_as_controller:
        holster_belt:
          right: "Pistolet"
          left: "Marteau"
          front: "Chargeur"
          utility: "Lampe torche"
  barricades:
    openings_count: 4
    planks_per_opening: 3
    hits_per_nail: 3
    nails_per_plank: 2
    plank_states:
      - "0 clou : tombe au sol"
      - "1 clou : pend librement"
      - "2 clous : fixée"
    zombie_attack_hits_to_break: 3
  weapons:
    firearms:
      pistol:
        capacity: 12
        caliber: "9mm"
        reload_flow: "Éjection chargeur vide -> saisie nouveau chargeur à la ceinture -> insertion sous poignée -> culasse"
        empty_feedback: "Clic sec et vibration"
    melee:
      types:
        - "Marteau"
        - "Hache"
        - "Pied-de-biche"
      velocity_threshold_mps: 1.6
    hitboxes:
      head:
        multiplier: 1.0
        bullet_damage: "One-shot (100% PV)"
        axe_damage: 100
        crowbar_damage: 50
      torso_and_arms:
        bullet_damage: 33
        axe_damage: 50
        crowbar_damage: 25
        slowdown_seconds: 1.8
      legs:
        bullet_damage: 20
        axe_damage: 33
        crowbar_damage: 15
        slowdown_seconds: 2.7
  bestiary:
    - name: "Le Rôdeur (Standard)"
      height_m: 1.76
      speed_multiplier: 1.0
      speed_mps: 0.9
      health_multiplier: 1.0
      attack_type: "Coup de griffe"
      damage_player: "1 PV / 1.5s (20% PV joueur)"
      waves: "1 à 5"
    - name: "Le Cogneur (Renforcé)"
      height_m: 1.93
      speed_multiplier: 0.9
      health_multiplier: 1.5
      attack_type: "Coups de poing"
      damage_player: "1 PV / 1.5s (33% à 40% PV joueur)"
      waves: "2 à 5 (environ 1 zombie sur 5)"
    - name: "Le Coureur (Rapide)"
      height_m: 1.69
      speed_multiplier: 1.6
      health_multiplier: 0.7
      attack_type: "Coups de pied"
      damage_player: "1 PV / 1.0s"
      waves: "3 à 5 (10% en vague 2 jusqu'à 40% en vague 5)"
  waves_progression:
    total_zombies: 66
    transition_seconds: "30 à 45"
    waves:
      - wave: 1
        zombies_count: 4
        openings_attacked: 2
        behavior: "Approche frontale très lente"
        unlock: "Salle principale (Bunker)"
      - wave: 2
        zombies_count: 8
        openings_attacked: 4
        behavior: "Apparition dans les angles morts, cadence accélérée"
        unlock: "2ème salle (Cuisine)"
      - wave: 3
        zombies_count: 12
        openings_attacked: 4
        behavior: "Cadence accélérée, assaut combiné"
        unlock: "3ème salle (Stockage)"
      - wave: 4
        zombies_count: 18
        openings_attacked: 4
        behavior: "Assaut de tous les côtés, snap turn indispensable"
        unlock: "4ème salle (Couloir Ouest / Salle Générateur)"
      - wave: 5
        zombies_count: 24
        openings_attacked: 4
        behavior: "Assaut maximal vers le générateur"
        unlock: "Générateur et bouton d'évacuation"

palette:
  ui:
    amber_primary: "#FFBF45"
    amber_light: "#FFD966"
    off_white: "#E0EBE6"
    gray_green: "#789682"
    terminal_green: "#59FF8C"
    alert_red: "#FF453D"
  game_feedback:
    outline_idle: "#8C6926"
    outline_hover: "#FFD166"
    damage_vignette: "#8C0000"
    led_on: "#33FF4C"
    led_off: "#FF261A"
    generator_victory: "#FFCC80"
  environment:
    shadows: "#020101"
    dark_wood: "#1B0F07"
    lit_wood: "#3C2615"
    lamp_halo: "#CA875C"
    rust: "#892C1E"
    night_sky: "#060D17"
